<!doctype html>
<html lang="pt-BR">
<head>
  <!-- Arquivo gerado por "npm run build" a partir de index.html + src/. Edite os fontes, não este arquivo. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060d">
  <title>Ghosts'n Goblins 3D — Remake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
  <style>
:root {
  --ink: #f2ecdf;
  --red: #ff3b2f;
  --gold: #ffcf4a;
  --bg: #05060d;
  --pixel: 'Press Start 2P', 'Courier New', monospace;
  --gothic: 'Cinzel Decorative', 'Times New Roman', serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; color: var(--ink); }
body { font-family: var(--pixel); -webkit-user-select: none; user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hidden { display: none !important; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; font-size: clamp(9px, 1.5vw, 16px); text-shadow: 2px 2px 0 #000, 0 0 8px rgba(0,0,0,.8); }
.hud-top { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 16px; right: 16px; display: flex; justify-content: space-between; }
.hud-block { display: flex; flex-direction: column; gap: .5em; min-width: 8em; }
.hud-block.center { align-items: center; }
.hud-block.right { align-items: flex-end; }
.lbl { color: var(--ink); opacity: .95; }
.lbl.red { color: var(--red); }
#hud-time.hurry { color: var(--red); animation: blink .5s steps(2) infinite; }
.hud-bottom { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: flex-end; }
#hud-lives { display: flex; gap: 6px; }
#hud-lives i { width: 1.4em; height: 1.6em; display: block; background: linear-gradient(#cfd8e8, #7a879e); clip-path: polygon(20% 0, 80% 0, 100% 30%, 85% 100%, 15% 100%, 0 30%); box-shadow: 0 0 6px rgba(160,190,255,.6); }
#hud-stage { opacity: .7; font-size: .8em; }
#hud-weapon { width: 3.2em; height: 3.2em; border: 2px solid rgba(255,255,255,.35); border-radius: 6px; display: grid; place-items: center; background: rgba(0,0,0,.35); }
#hud-weapon canvas { width: 90%; height: 90%; image-rendering: pixelated; }

/* ---------- Screens ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 16px; }
.screen.interactive { pointer-events: auto; }
.title-logo { font-family: var(--gothic); font-weight: 900; font-size: clamp(34px, 8.4vw, 112px); line-height: .95; letter-spacing: .02em;
  background: linear-gradient(180deg, #fff6d0 0%, #ffcf4a 35%, #e0641c 65%, #8a1408 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 4px 0 #2a0400) drop-shadow(0 0 24px rgba(255,90,20,.45)); }
.title-logo small { display: block; font-size: .32em; letter-spacing: .3em; margin-top: .35em; color: transparent; }
.title-sub { margin-top: 2.2em; font-size: clamp(10px, 1.6vw, 16px); color: var(--ink); animation: blink 1.1s steps(2) infinite; }
.title-note { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); font-size: clamp(7px, 1vw, 10px); opacity: .55; line-height: 1.8; max-width: 92vw; }
.title-menu { margin-top: 1.6em; display: flex; flex-direction: column; gap: 1em; font-size: clamp(9px, 1.4vw, 14px); }
.title-menu .opt { opacity: .6; }
.title-menu .opt.sel { opacity: 1; color: var(--gold); }
.title-menu .opt.sel::before { content: '▶ '; }
.controls { margin-top: 2.4em; font-size: clamp(7px, 1.05vw, 11px); line-height: 2.1; opacity: .8; }
.controls b { color: var(--gold); font-weight: normal; }
.banner { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: clamp(12px, 2.4vw, 26px); text-shadow: 3px 3px 0 #000; pointer-events: none; }
.banner .big { font-size: 1.6em; color: var(--gold); display: block; margin-bottom: .6em; }
.banner .blink { animation: blink .6s steps(2) infinite; }
.story { max-width: min(880px, 92vw); font-size: clamp(9px, 1.5vw, 15px); line-height: 2.2; text-shadow: 2px 2px 0 #000; }
.story .gold { color: var(--gold); }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; }
#fade.on { opacity: 1; }

/* ---------- Stage map ---------- */
.mapwrap { width: min(980px, 94vw); }
.mapwrap h2 { font-family: var(--gothic); font-size: clamp(18px, 3.4vw, 40px); color: var(--gold); margin: 0 0 .6em; text-shadow: 0 3px 0 #2a0400; }
.mapwrap canvas { width: 100%; height: auto; border: 3px solid #6b5a3a; border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,.8), inset 0 0 30px #000; image-rendering: auto; background: #0b0a10; }
.mapwrap p { font-size: clamp(9px, 1.4vw, 14px); margin-top: 1.2em; }

/* ---------- Touch controls ---------- */
#touch { position: absolute; inset: 0; pointer-events: none; }
#touch button { pointer-events: auto; font: inherit; color: #fff; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); border-radius: 50%; width: 64px; height: 64px; font-size: 22px; touch-action: none; }
#touch button.on { background: rgba(255,207,74,.45); }
#touch .pad { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: max(70px, env(safe-area-inset-bottom)); display: grid; grid-template: 'a u b' 64px 'l . r' 64px 'c d e' 64px / 64px 64px 64px; }
#touch .pad [data-k=up] { grid-area: u; } #touch .pad [data-k=left] { grid-area: l; } #touch .pad [data-k=right] { grid-area: r; } #touch .pad [data-k=down] { grid-area: d; }
#touch .btns { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: max(80px, env(safe-area-inset-bottom)); display: flex; gap: 18px; align-items: flex-end; }
#touch .btns [data-k=jump] { width: 78px; height: 78px; margin-bottom: 40px; }
#touch .btns [data-k=fire] { width: 78px; height: 78px; }
#touch .start { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); width: auto !important; height: auto !important; border-radius: 10px !important; padding: 8px 14px; font-size: 10px !important; }

#rotate-hint { position: absolute; top: 18%; left: 16px; right: 16px; text-align: center; font-size: 11px; line-height: 1.8; opacity: .75; pointer-events: none; display: none; }
@media (pointer: coarse) {
  #hud-stage { display: none; }
}
@media (pointer: coarse) and (orientation: portrait) {
  #rotate-hint { display: block; }
}

@keyframes blink { 50% { opacity: 0; } }
@media (max-width: 640px) {
  .hud-block { min-width: 0; }
}
</style>
  </head>
<body>
  <div id="app">
    <canvas id="view"></canvas>
    <div id="hud" class="hidden">
      <div class="hud-top">
        <div class="hud-block"><span class="lbl red">JOGADOR</span><span id="hud-score">0</span></div>
        <div class="hud-block center"><span class="lbl red">RECORDE</span><span id="hud-top">10000</span></div>
        <div class="hud-block right"><span class="lbl">TEMPO</span><span id="hud-time">3:00</span></div>
      </div>
      <div class="hud-bottom">
        <div id="hud-lives"></div>
        <div id="hud-stage"></div>
        <div id="hud-weapon"></div>
      </div>
    </div>
    <div id="screen" class="screen"></div>
    <div id="banner" class="banner hidden"></div>
    <div id="fade"></div>
    <div id="rotate-hint">↻ Gire o aparelho para a horizontal<br>para uma visão maior da fase</div>
    <div id="touch" class="hidden">
      <div class="pad">
        <button data-k="left" aria-label="esquerda">◀</button>
        <button data-k="up" aria-label="cima">▲</button>
        <button data-k="down" aria-label="baixo">▼</button>
        <button data-k="right" aria-label="direita">▶</button>
      </div>
      <div class="btns">
        <button data-k="fire" aria-label="atacar">⚔</button>
        <button data-k="jump" aria-label="pular">⤒</button>
      </div>
      <button class="start" data-k="start" aria-label="start">START</button>
    </div>
    <noscript>Este jogo precisa de JavaScript.</noscript>
  </div>
